<style id="css">
:root{
  color-scheme:light;
  --ground:#e9ecec; --surface:#fbfcfb; --surface-2:#f2f4f4; --raise:#ffffff;
  --ink:#13181b; --ink-2:#3f4b52; --muted:#6b777e;
  --rule:#d4dad9; --rule-strong:#b3bcbb;
  --es:#2a78d6; --nq:#d9561f; --ok:#16704a; --no:#a63a30; --flag:#8f6100;
  --okbg:rgba(22,112,74,.12); --nobg:rgba(166,58,48,.12); --flagbg:rgba(143,97,0,.13);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0d1113; --surface:#161b1e; --surface-2:#1b2124; --raise:#1f262a;
  --ink:#e6eae9; --ink-2:#a7b3b9; --muted:#7c898f;
  --rule:#242c30; --rule-strong:#364247;
  --es:#4a90e8; --nq:#e2693a; --ok:#3aa87a; --no:#e0716a; --flag:#c99a2e;
  --okbg:rgba(58,168,122,.16); --nobg:rgba(224,113,106,.16); --flagbg:rgba(201,154,46,.16);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0d1113; --surface:#161b1e; --surface-2:#1b2124; --raise:#1f262a;
  --ink:#e6eae9; --ink-2:#a7b3b9; --muted:#7c898f;
  --rule:#242c30; --rule-strong:#364247;
  --es:#4a90e8; --nq:#e2693a; --ok:#3aa87a; --no:#e0716a; --flag:#c99a2e;
  --okbg:rgba(58,168,122,.16); --nobg:rgba(224,113,106,.16); --flagbg:rgba(201,154,46,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:0 64px}

header{padding-block:38px 0}
.eyebrow{font-family:"JetBrains Mono",monospace;font-size:.66rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(1.7rem,4.4vw,2.5rem);line-height:1.08;letter-spacing:-.022em;
  font-weight:700;margin:.35em 0 0;text-wrap:balance}
.lede{font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem;line-height:1.6;
  color:var(--ink-2);max-width:62ch;margin-top:14px}

.funnel{display:flex;flex-wrap:wrap;gap:0;margin-top:28px;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule)}
.funnel div{flex:1 1 150px;padding:15px 18px 16px 0;border-right:1px solid var(--rule)}
.funnel div:last-child{border-right:0}
.funnel dt{font-family:"JetBrains Mono",monospace;font-size:.6rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.funnel dd{margin:5px 0 0;font-family:"JetBrains Mono",monospace;font-weight:700;
  font-size:1.22rem;letter-spacing:-.02em}
.funnel .sub{font-size:.72rem;color:var(--muted);font-weight:400;font-family:Archivo,sans-serif;
  letter-spacing:0;margin-top:2px}

.bar{position:sticky;top:0;z-index:20;background:var(--ground);
  padding-block:14px 12px;border-bottom:1px solid var(--rule-strong);margin-top:30px}
.progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;
  border:1px solid var(--rule)}
.progress i{display:block;height:100%;background:var(--ok);transition:width .25s}
.barrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:11px}
.count{font-family:"JetBrains Mono",monospace;font-size:.82rem;font-weight:700;
  white-space:nowrap;margin-right:4px}
.count span{color:var(--muted);font-weight:400}
.chip{appearance:none;border:1px solid var(--rule-strong);background:var(--surface);
  color:var(--ink-2);font:inherit;font-size:.76rem;padding:5px 11px;border-radius:2px;
  cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip b{font-family:"JetBrains Mono",monospace;font-weight:700}

.day{margin-top:30px}
.dayhead{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule-strong);
  padding-bottom:7px;margin-bottom:2px}
.dayhead h2{font-size:1rem;font-weight:700;letter-spacing:-.01em;margin:0}
.dayhead .n{font-family:"JetBrains Mono",monospace;font-size:.72rem;color:var(--muted)}

.row{border-bottom:1px solid var(--rule);padding:14px 0;display:grid;gap:12px;
  grid-template-columns:1fr;align-items:start}
@media(min-width:760px){.row{grid-template-columns:1fr 210px}}
.row.done{opacity:.5}
.rowhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px}
.tid{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:.94rem}
.sym{font-family:"JetBrains Mono",monospace;font-size:.68rem;font-weight:700;letter-spacing:.05em;
  padding:2px 6px;border-radius:2px;color:#fff}
.sym.ES{background:var(--es)} .sym.NQ{background:var(--nq)}
.dir{font-size:.76rem;font-weight:600;letter-spacing:.04em}
.tag{font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:2px;letter-spacing:.02em}
.tag.taget{background:var(--okbg);color:var(--ok)}
.tag.tynd-luk{background:var(--nobg);color:var(--no)}
.tag.loft-kant{background:var(--flagbg);color:var(--flag)}
.tag.formregel{background:var(--flagbg);color:var(--flag)}
.verdict{font-size:.88rem;color:var(--ink-2);margin-top:7px;max-width:64ch}
.verdict b{color:var(--ink)}
.nums{display:flex;flex-wrap:wrap;gap:5px 20px;margin-top:9px;
  font-family:"JetBrains Mono",monospace;font-size:.76rem;color:var(--muted)}
.nums b{color:var(--ink);font-weight:500}
.acts{display:flex;flex-direction:column;gap:7px}
.btns{display:flex;gap:7px}
.btn{flex:1;appearance:none;border:1px solid var(--rule-strong);background:var(--surface);
  color:var(--ink-2);font:inherit;font-size:.8rem;font-weight:600;padding:7px 4px;
  border-radius:2px;cursor:pointer}
.btn:hover{border-color:var(--ink-2)}
.btn[aria-pressed="true"].ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn[aria-pressed="true"].no{background:var(--no);border-color:var(--no);color:#fff}
.note{width:100%;font:inherit;font-size:.8rem;padding:7px 9px;border:1px solid var(--rule-strong);
  border-radius:2px;background:var(--surface);color:var(--ink);resize:vertical;min-height:52px}
.note::placeholder{color:var(--muted)}

.ro{margin-top:12px;padding:10px 14px;border-left:3px solid var(--flag);background:var(--surface);
  font-size:.85rem;color:var(--ink-2)}
footer{margin-top:52px;border-top:1px solid var(--rule-strong);padding-top:22px;
  font-size:.86rem;color:var(--ink-2);max-width:66ch}
footer p+p{margin-top:10px}
footer b{color:var(--ink)}
:focus-visible{outline:2px solid var(--es);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function num(v,d){ if(v===undefined||v===null) return "—";

function marked(){ return DATA.filter(c=>MARKS[c.id] && MARKS[c.id].v).length; }

function rowNums(c){
  const n = [];
  n.push('EQ-linje <b>'+num(c.linje,3)+'</b>');
  n.push('anker <b>'+num(c.anker,2)+'</b>');
  n.push('raid-luk <b>'+num(c.luk,2)+'</b>');

  return n.join("");

  if(lastDay!==null) h += '</section>';

  h += '<footer><p><b>Når listen er tom, er materialet dækket.</b> De '+(TOT.raids-DATA.length).toLocaleString("da-DK")
     + ' øvrige beslutninger blev truffet med en margin der er mange gange større end enhver tænkelig forskel '
     + 'mellem mit datafeed og dit chart — de kan ikke vendes af en tick.</p>'
     + '<p>Finder du uenigheder, så send dem tilbage. Ét fejlfundet mønster her er mere værd end '
     + 'hundrede rigtige.</p></footer></div>';

  document.getElementById("app").innerHTML = h;
}

function schedulePublish(){
  if(readOnly) return;
  dirty = true;
  clearTimeout(schedulePublish.t);
  schedulePublish.t = setTimeout(doPublish, 1200);
}

async function doPublish(){
  if(publishing || !dirty || readOnly) return;
  const api = await claude.use("artifact");
  if(!api){ readOnly = true; render(); return; }
  publishing = true; dirty = false;
  try{
    await api.publish(buildDoc());
  }catch(e){
    if(e && (e.code === "not_writer" || e.code === "not_granted" || e.code === "not_declared")){
      readOnly = true; render();
    }
    // conflict: viewet genindlaeses af sig selv - ingen retry
  }finally{ publishing = false; }
}

function buildDoc(){
  const code = document.getElementById("code").textContent
    .replace(/\/\/ STATE-START[\s\S]*?\/\/ STATE-END/,
             "// STATE-START\nlet MARKS = " + JSON.stringify(MARKS) + ";\n// STATE-END");
  const css = document.getElementById("css").textContent;
  const S = "scr" + "ipt";
  return '<!doctype html><html lang="da"><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + '<title>EQ-revision</title>'
    + '<link rel="preconnect" href="https://fonts.googleapis.com">'
    + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;700&display=swap">'
    + '<style id="css">' + css + '</style></head><body>'
    + '<div id="app"></div><' + S + ' id="code">' + code + '</' + S + '></body></html>';
}

document.addEventListener("click", ev=>{
  const chip = ev.target.closest(".chip");
  if(chip){ filter = chip.dataset.f; render(); return; }
  const btn = ev.target.closest(".btn");
  if(!btn) return;
  const id = btn.closest(".row").dataset.id;
  const cur = MARKS[id] || {};
  const v = btn.dataset.v;
  MARKS[id] = (cur.v === v) ? {note:cur.note||""} : {v:v, note:cur.note||""};
  render();
  schedulePublish();
});
document.addEventListener("input", ev=>{
  if(!ev.target.classList.contains("note")) return;
  const id = ev.target.closest(".row").dataset.id;
  MARKS[id] = MARKS[id] || {};
  MARKS[id].note = ev.target.value;
  schedulePublish();
});

render();
claude.use("artifact").then(api=>{ if(!api){ readOnly = true; render(); } });
</script>
