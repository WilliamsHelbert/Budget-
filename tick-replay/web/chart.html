<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tick Replay</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ============ top bar ============ -->
  <header class="topbar">
    <a href="./" class="tb-btn home" id="homeLink" title="Back to the dashboard">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span id="btName" class="bt-name" hidden></span>
    <div class="tb-sym" title="Symbol">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>
      <select id="symbol"></select>
    </div>
    <span class="tb-sep"></span>
    <div class="tfs" id="tfs"></div>
    <span class="tb-sep"></span>
    <div class="tb-menu" id="typeMenu">
      <button class="tb-btn" id="typeBtn" title="Chart type"></button>
      <div class="dropdown" id="typeDrop"></div>
    </div>
    <div class="tb-menu" id="indMenu">
      <button class="tb-btn text" id="indBtn" title="Indicators">
        <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-8 4 5"/></svg><span>Indicators</span>
      </button>
      <div class="dropdown" id="indDrop"></div>
    </div>
    <span class="tb-sep"></span>
    <input type="datetime-local" id="start" step="1" title="Replay start (New York time)">
    <button class="tb-btn text" id="go" title="Jump to this time">Go</button>
    <button class="tb-btn text gold" id="marketOpen" title="Start at 09:25 New York on this day and play live at 1x">🔔 Market Open</button>
    <span class="spacer"></span>
    <span id="countdown" class="countdown"></span>
    <span id="clock" class="clock" title="Replay time, New York">--</span>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="shotBtn" title="Save a screenshot (PNG)">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </button>
    <button class="tb-btn" id="settingsBtn" title="Chart settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <button class="tb-btn" id="panelBtn" title="Show / hide the side panel">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
    </button>
    <button class="tb-btn" id="fullBtn" title="Full screen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>

  <div class="workspace">
    <!-- ============ drawing tools ============ -->
    <nav class="tools" id="tools" aria-label="Drawing tools"></nav>

    <!-- ============ chart ============ -->
    <section class="chart-wrap">
      <div id="chart"></div>
      <canvas id="draw"></canvas>
      <div class="legend" id="legend"></div>
      <div class="replay-bar" id="replayBar">
        <span class="grip" id="grip" title="Drag to move">⋮⋮</span>
        <button class="rb-btn" id="play" title="Play / pause (Space)"></button>
        <button class="rb-btn" id="stepTick" title="Next tick (→)">
          <svg viewBox="0 0 24 24"><path d="M6 5v14l9-7zM18 5v14"/></svg>
        </button>
        <button class="rb-btn" id="stepBar" title="Next candle (Shift+→)">
          <svg viewBox="0 0 24 24"><path d="M4 5v14l7-7zM12 5v14l7-7z"/></svg>
        </button>
        <select id="speed" class="rb-speed" title="Replay speed"></select>
        <label class="rb-check" title="Jump over closed-market periods (no trades for 5+ minutes)">
          <input type="checkbox" id="skipGaps" checked><span>skip closed</span>
        </label>
      </div>
      <div class="text-edit" id="textEdit" hidden>
        <input id="textInput" maxlength="120" placeholder="Text…">
      </div>
    </section>

    <!-- ============ side panel ============ -->
    <aside class="side" id="side">
      <section class="panel">
        <div class="quote-box">
          <div><div class="muted small">Last</div><div id="last" class="last">--</div></div>
          <div class="right"><div class="muted small">Bid × Ask</div><div id="quote" class="quote">--</div></div>
        </div>
        <dl class="stats">
          <dt id="balanceRow" hidden>Balance</dt><dd id="balanceRowVal" hidden><span id="balance">--</span></dd>
          <dt>Position</dt><dd id="posQty">0</dd>
          <dt>Avg price</dt><dd id="posAvg">--</dd>
          <dt>Open P&amp;L</dt><dd id="pnlOpen">$0.00</dd>
          <dt>Closed P&amp;L</dt><dd id="pnlClosed">$0.00</dd>
          <dt>Fills</dt><dd id="fills">0</dd>
        </dl>
        <p class="hint" id="fillNote"></p>
      </section>
      <section class="panel tape">
        <h2>Time &amp; Sales</h2>
        <table>
          <thead><tr><th>Time (NY)</th><th>Price</th><th>Size</th></tr></thead>
          <tbody id="tape"></tbody>
        </table>
      </section>
    </aside>
  </div>

  <!-- ============ bottom trade bar ============ -->
  <footer class="bottombar">
    <button class="trade-btn buy" id="buy" title="Buy market (B)">Buy <span id="askLbl"></span></button>
    <div class="qty">
      <button id="qtyDown" aria-label="Less">−</button>
      <input type="number" id="qty" value="1" min="1" max="100">
      <button id="qtyUp" aria-label="More">+</button>
    </div>
    <button class="trade-btn sell" id="sell" title="Sell market (S)">Sell <span id="bidLbl"></span></button>
    <button class="trade-btn flat" id="flat" title="Close position (F)">Flat</button>
    <span class="bb-pos" id="bbPos"></span>
    <span class="spacer"></span>
    <span class="bb-item" id="bbBalance" hidden></span>
    <span class="bb-keys muted small">Space play · → tick · Shift+→ bar · B/S/F trade · Esc cancel tool · Del delete drawing</span>
  </footer>

  <!-- ============ settings ============ -->
  <dialog id="settings">
    <form method="dialog" class="set-form">
      <div class="set-head">
        <h2>Settings</h2>
        <button class="x" value="cancel" formnovalidate aria-label="Close">✕</button>
      </div>
      <div class="set-body">
        <nav class="set-tabs" id="setTabs">
          <button type="button" data-tab="symbol" class="on">Symbol</button>
          <button type="button" data-tab="canvas">Canvas</button>
          <button type="button" data-tab="trading">Trading</button>
        </nav>
        <div class="set-pane" data-pane="symbol">
          <h4>Candles</h4>
          <div class="set-row"><label>Body</label><span><input type="color" data-set="upColor"> <input type="color" data-set="downColor"></span></div>
          <div class="set-row"><label>Wick</label><span><input type="color" data-set="wickUp"> <input type="color" data-set="wickDown"></span></div>
          <div class="set-row"><label>Border</label><span><input type="checkbox" data-set="border"> <input type="color" data-set="borderUp"> <input type="color" data-set="borderDown"></span></div>
          <h4>Volume</h4>
          <div class="set-row"><label>Show volume</label><span><input type="checkbox" data-set="volume"></span></div>
        </div>
        <div class="set-pane" data-pane="canvas" hidden>
          <h4>Chart basic styles</h4>
          <div class="set-row"><label>Background</label><span><input type="color" data-set="bg"></span></div>
          <div class="set-row"><label>Grid lines</label><span>
            <select data-set="grid"><option value="both">Vert and horz</option><option value="vert">Vert only</option><option value="horz">Horz only</option><option value="none">None</option></select>
            <input type="color" data-set="gridColor"></span></div>
          <div class="set-row"><label>Crosshair</label><span>
            <select data-set="crosshair"><option value="normal">Free</option><option value="magnet">Magnet to candles</option></select>
            <input type="color" data-set="crossColor"></span></div>
          <div class="set-row"><label>Watermark</label><span>
            <select data-set="watermark"><option value="hidden">Hidden</option><option value="symbol">Symbol + timeframe</option></select></span></div>
          <h4>Scales</h4>
          <div class="set-row"><label>Text</label><span><input type="color" data-set="text">
            <select data-set="fontSize"><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>16</option></select></span></div>
          <div class="set-row"><label>Lines</label><span><input type="color" data-set="scaleLine"></span></div>
          <div class="set-row"><label>Right margin (bars)</label><span><input type="number" data-set="rightOffset" min="0" max="100" style="width:70px"></span></div>
        </div>
        <div class="set-pane" data-pane="trading" hidden>
          <h4>Panels</h4>
          <div class="set-row"><label>Time &amp; Sales + position panel</label><span><input type="checkbox" data-set="sidePanel"></span></div>
          <div class="set-row"><label>Fill markers on chart</label><span><input type="checkbox" data-set="markers"></span></div>
          <h4>Drawings</h4>
          <div class="set-row"><label>Default drawing color</label><span><input type="color" data-set="drawColor"></span></div>
          <div class="set-row"><label>Position tool reward : risk</label><span><input type="number" data-set="rr" min="0.5" max="10" step="0.5" style="width:70px"></span></div>
        </div>
      </div>
      <div class="set-foot">
        <button type="button" class="btn ghost" id="setReset">Reset to default</button>
        <span class="spacer"></span>
        <button class="btn ghost" value="cancel" formnovalidate>Cancel</button>
        <button class="btn primary" value="ok">Ok</button>
      </div>
    </form>
  </dialog>

  <div class="ctx" id="ctx" hidden></div>
  <div id="status" class="status"></div>

  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script src="drawings.js"></script>
  <script src="app.js"></script>
</body>
</html>
