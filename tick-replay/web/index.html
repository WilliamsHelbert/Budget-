<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tick Replay</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a href="#dashboard" class="brand"><img src="favicon.png" alt="" width="26" height="26"><span>TICK REPLAY</span></a>

      <a class="nav-item" href="#dashboard" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </a>
      <a class="nav-item" href="#sessions" data-view="sessions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
        <span>Sessions</span>
      </a>
      <a class="nav-item" href="#trades" data-view="trades">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/><path d="M4 20h16" opacity=".5"/></svg>
        <span>Trades</span>
      </a>
      <a class="nav-item" href="#analytics" data-view="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg>
        <span>Analytics</span>
      </a>
      <a class="nav-item" href="#data" data-view="data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
        <span>Data</span>
      </a>

      <div class="side-foot">
        <div class="quick">
          <h4>🔔 Quick practice</h4>
          <p id="quickSub">Jump into the latest open, live at 1x.</p>
          <a class="btn btn-gold btn-sm" id="quickBtn" href="chart.html">Market Open</a>
        </div>
        <span class="small muted" style="padding: 0 10px">Local · your data stays on this PC</span>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 id="title">Dashboard</h1>
          <div class="sub" id="subtitle"></div>
        </div>
        <div class="actions">
          <button class="btn btn-gold" id="newBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            New session
          </button>
        </div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <dialog id="dlg">
    <form method="dialog" id="dlgForm">
      <div class="modal-head">
        <h2 id="dlgTitle">New backtest session</h2>
        <p class="muted small" style="margin:4px 0 0">A session keeps its own balance, trades and replay position.</p>
      </div>
      <div class="modal-body">
        <label class="field">Name
          <input class="input" id="fName" maxlength="80" placeholder="e.g. NQ opens – September" required>
        </label>
        <div class="field" id="fSymsField">Symbols
          <div class="sym-pick" id="fSyms"></div>
        </div>
        <div class="two" id="fDates">
          <label class="field">Start date <input class="input" type="date" id="fStart" required></label>
          <label class="field">End date <input class="input" type="date" id="fEnd" required></label>
        </div>
        <div class="two">
          <label class="field">Start time (New York)
            <select class="input" id="fStartTime">
              <option value="09:25">09:25 – just before the open</option>
              <option value="08:30">08:30 – news / data releases</option>
              <option value="00:00">00:00 – overnight</option>
            </select>
          </label>
          <label class="field">Starting balance ($) <input class="input" type="number" id="fBal" value="50000" min="100" step="100" required></label>
        </div>
        <label class="field">Commission per contract per side ($)
          <input class="input" type="number" id="fFee" value="0" min="0" max="100" step="0.01">
        </label>
        <p class="hint err" id="dlgErr" hidden></p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" value="cancel" formnovalidate>Cancel</button>
        <button class="btn btn-gold" id="dlgOk" value="ok">Create session</button>
      </div>
    </form>
  </dialog>

  <div class="tip" id="tip" hidden></div>

  <script src="vendor/lightweight-charts.standalone.production.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
